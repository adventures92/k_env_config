name: prepare-release

# Step 1 of 2 in cutting a release.
#
#   prepare-release  (you dispatch)  → opens a "Release X.Y.Z" pull request
#   tag-and-release  (on merge)      → tags and calls release.yml, which publishes
#
# The pull request is the review gate. Everything in its diff is mechanical — a version bump, a
# CHANGELOG promotion and the install snippets — because the prose was already reviewed in the
# pull request that added it.
#
# All the rewriting lives in scripts/prepare-release.sh so it can be run and inspected locally:
#
#   ./scripts/prepare-release.sh patch --dry-run
#
# The bump lands in kenv-plugin/gradle.properties, which is the path tag-and-release.yml watches.
# kenv-plugin is a separate Gradle build and does not see the root gradle.properties; a bump
# written to the root file would change nothing and tag nothing.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to increment"
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      version:
        description: "Explicit version (overrides bump), e.g. 1.2.3 — leave blank to use bump"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the script checks for an existing tag

      - name: Bump version and promote the changelog
        id: prep
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            ./scripts/prepare-release.sh --version "${{ inputs.version }}"
          else
            ./scripts/prepare-release.sh "${{ inputs.bump }}"
          fi

      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prep.outputs.version }}
          CURRENT: ${{ steps.prep.outputs.current }}
        run: |
          BRANCH="release/$VERSION"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"

          # `git add -A`, not a list of paths. The script rewrites the install snippets in README.md
          # and docs/ as well as the version and the changelog, and an explicit list is exactly the
          # kind of thing that silently stops matching when the script's scope changes — leaving a
          # released version whose README still advertises the previous one.
          git add -A
          git commit -m "Release $VERSION

          Bump VERSION_NAME $CURRENT -> $VERSION in kenv-plugin/gradle.properties, promote the
          CHANGELOG's Unreleased section, and point the install snippets at $VERSION. Merging this
          tags v$VERSION and publishes to Maven Central."
          git push -u origin "$BRANCH"

          # The release notes are exactly what release.yml will extract, so the pull request shows
          # the text that becomes the GitHub Release.
          NOTES="$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { c = 1; next }
            c && /^## \[/          { exit }
            c                      { print }
          ' CHANGELOG.md)"

          # --body-file, not --body "$(cat <<EOF ...)". A heredoc nested inside a command
          # substitution is parsed differently by bash 3.2, which mis-reads the apostrophe in
          # "CHANGELOG's" as an opening quote and fails the whole script. Runners have bash 5, but
          # the nested form also cannot be syntax-checked on a Mac, so it silently stops being
          # verifiable locally. A plain heredoc at statement level parses identically everywhere.
          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          Bumps \`VERSION_NAME\` **$CURRENT → $VERSION** in \`kenv-plugin/gradle.properties\`, promotes the
          CHANGELOG's Unreleased section, and rewrites the install snippets in \`README.md\` and \`docs/\`.

          **Merging this publishes to Maven Central.** \`tag-and-release\` watches
          \`kenv-plugin/gradle.properties\`, sees \`VERSION_NAME\` change, creates \`v$VERSION\`, and calls
          \`release.yml\` — which runs the full gate and then publishes. Maven Central never accepts a
          re-publish of a version, so the merge is the point of no return.

          ## Release notes as they will appear

          $NOTES

          ---

          Generated by \`prepare-release.yml\` from \`scripts/prepare-release.sh\`.
          EOF

          gh pr create --base main --head "$BRANCH" \
            --title "Release $VERSION" \
            --body-file "$RUNNER_TEMP/pr-body.md"
