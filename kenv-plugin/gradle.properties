# The published version.
#
# This lives here rather than in the root gradle.properties because kenv-plugin is a separate
# build: the root's properties are not visible to it. Verified, not assumed — a probe task reading
# providers.gradleProperty("VERSION_NAME") with the value set only at the root returned null.
#
# The release workflow overrides it with -PVERSION_NAME=<tag without the leading v>, so the tag is
# the source of truth for what gets published and this value is the local/default.
VERSION_NAME=0.1.0
